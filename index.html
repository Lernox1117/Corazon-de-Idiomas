<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corazón de idiomas</title>
<style>
  /* Layout: lienzo a pantalla completa de noche; un corazón hecho de palabras y fuegos artificiales con forma de corazón al tocar.
     Look único y oscuro por decisión propia (cielo nocturno), por eso no hay variante clara. */
  :root {
    --bg: #12060c;
    --bg-glow: #3a0d24;
    --rose: #ff4d85;
    --blush: #ffb8c8;
    --gold: #ffd9a8;
    --ink: #ffe9ee;
    --font-main: "Times New Roman", Times, "Liberation Serif", serif;
    color-scheme: dark;
  }
  html { height: 100%; background-color: var(--bg); }
  body {
    box-sizing: border-box;
    height: 100%;
    margin: 0;
    padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
    overflow: hidden;
    background-color: var(--bg);
    background-image: radial-gradient(ellipse 90% 70% at 50% 42%, var(--bg-glow) 0%, var(--bg) 70%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--font-main);
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #c {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: pointer;
  }
  #again {
    position: fixed;
    z-index: 2;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    right: max(16px, env(safe-area-inset-right, 0px));
    padding: 8px 14px;
    border: 1px solid rgba(255, 184, 200, 0.35);
    border-radius: 999px;
    background: rgba(18, 6, 12, 0.55);
    color: var(--blush);
    font: 400 12px/1 var(--font-main);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
  }
  #again:hover { border-color: var(--blush); }
  #again:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  #hint {
    position: fixed;
    z-index: 1;
    left: 0;
    right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
    text-align: center;
    color: var(--gold);
    font: 400 13px/1 var(--font-main);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  #hint.on { opacity: 0.8; animation: breathe 2.4s ease-in-out infinite; }
  #hint.off { opacity: 0; animation: none; }
  @keyframes breathe { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.9; } }
  @media (prefers-reduced-motion: reduce) { #hint.on { animation: none; } }
</style>
</head>
<body>
<canvas id="c" aria-label="Un corazón formado por la frase te amo en muchos idiomas. Toca la pantalla para lanzar corazones pequeños."></canvas>
<button id="again" type="button">Reiniciar</button>
<div id="hint">Toca la pantalla</div>

<script>
(function () {
  "use strict";

  var LANGS = [
    ["Te amo", "Español"], ["I love you", "Inglés"], ["Je t'aime", "Francés"], ["Ti amo", "Italiano"],
    ["Ich liebe dich", "Alemán"], ["Eu te amo", "Portugués"], ["Ik hou van je", "Neerlandés"],
    ["T'estimo", "Catalán"], ["Jag älskar dig", "Sueco"], ["Jeg elsker deg", "Noruego"],
    ["Jeg elsker dig", "Danés"], ["Rakastan sinua", "Finés"], ["Szeretlek", "Húngaro"],
    ["Te iubesc", "Rumano"], ["Miluji tě", "Checo"], ["Milujem ťa", "Eslovaco"], ["Ljubim te", "Esloveno"],
    ["Volim te", "Croata"], ["Kocham Cię", "Polaco"], ["Të dua", "Albanés"], ["Seni seviyorum", "Turco"],
    ["Aku cinta kamu", "Indonesio"], ["Saya cintakan awak", "Malayo"], ["Mahal kita", "Filipino"],
    ["Anh yêu em", "Vietnamita"], ["Nakupenda", "Suajili"], ["Ngiyakuthanda", "Zulú"],
    ["Ek is lief vir jou", "Afrikáans"], ["Mi amas vin", "Esperanto"], ["Maite zaitut", "Euskera"],
    ["Te quero", "Gallego"], ["Munayki", "Quechua"], ["Rohayhu", "Guaraní"], ["Mwen renmen ou", "Criollo haitiano"],
    ["Tá grá agam duit", "Irlandés"], ["Rwy'n dy garu di", "Galés"], ["Ma armastan sind", "Estonio"],
    ["Aš tave myliu", "Lituano"], ["Es tevi mīlu", "Letón"], ["Kuv hlub koj", "Hmong"], ["Waan ku jecelahay", "Somalí"]
  ];
  var FONT_FAMILY = '"Times New Roman", Times, "Liberation Serif", serif';
  var UI_FONT = '400 12px "Times New Roman", Times, "Liberation Serif", serif';
  var BURST_COLORS = ["#ff4d85", "#ff8f9f", "#ffd166", "#ff7a59", "#ffb8c8", "#c9a6ff"];
  var TAU = Math.PI * 2;

  var cv = document.getElementById("c");
  var ctx = cv.getContext("2d");
  var btn = document.getElementById("again");
  var hint = document.getElementById("hint");
  var reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  var W = 0, H = 0, dpr = 1, cx = 0, cy = 0, u = 1, fs = 14, heartW = 300;
  var words = [], cg = 14, endT = 0;
  var stars = [], bursts = [];
  var startT = 0, lastT = 0, tapped = false;

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  // Punto del corazón centrado en (0,0); la punta queda abajo (y positivo).
  function raw(t) {
    return [
      16 * Math.pow(Math.sin(t), 3),
      -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) - 2.5
    ];
  }
  var HEART = new Path2D();
  (function () {
    for (var i = 0; i <= 48; i++) {
      var p = raw(i / 48 * TAU);
      if (i) HEART.lineTo(p[0], p[1]); else HEART.moveTo(p[0], p[1]);
    }
    HEART.closePath();
  })();

  function build() {
    words = [];
    heartW = Math.min(W * 0.84, H * 0.62 * 32 / 29);
    u = heartW / 32;
    cx = W / 2;
    cy = H * 0.45;
    fs = Math.max(9, Math.min(18, heartW / 32));
    ctx.font = "600 " + fs + "px " + FONT_FAMILY;

    // Contorno del corazón en pantalla, para saber cuánto ancho hay en cada fila.
    var poly = [];
    for (var i = 0; i < 360; i++) {
      var p = raw(i / 360 * TAU);
      poly.push([cx + u * p[0], cy + u * p[1]]);
    }
    function spans(y) {
      var xs = [];
      for (var i = 0; i < poly.length; i++) {
        var a = poly[i], b = poly[(i + 1) % poly.length];
        if ((a[1] <= y && b[1] > y) || (b[1] <= y && a[1] > y)) {
          xs.push(a[0] + (y - a[1]) / (b[1] - a[1]) * (b[0] - a[0]));
        }
      }
      xs.sort(function (m, n) { return m - n; });
      var out = [];
      for (var j = 0; j + 1 < xs.length; j += 2) out.push([xs[j], xs[j + 1]]);
      return out;
    }

    var pool = [];
    var firstPass = true;
    function refill() { pool = firstPass ? LANGS.slice(1) : shuffle(LANGS.slice(1)); firstPass = false; }
    refill();
    function widthOf(l) { return ctx.measureText(l[0] + ",").width; }

    var lh = fs * 1.25;
    var pad = fs * 0.3;
    var minGap = fs * 0.45;
    var top = cy - u * 14.5, bottom = cy + u * 14.5;
    var placed = [];
    var rowSet = {}, prevSet = {}, sinceEs = 3;
    for (var y = top + lh * 0.8; y < bottom - lh * 0.5; y += lh) {
      prevSet = rowSet;
      rowSet = {};
      var segs = spans(y);
      for (var si = 0; si < segs.length; si++) {
        var avail = segs[si][1] - segs[si][0] - pad * 2;
        var items = [], used = 0;
        for (;;) {
          var l = null, lw = 0;
          if (sinceEs >= 3) {
            var sw = widthOf(LANGS[0]);
            if (used + (items.length ? minGap : 0) + sw <= avail) { l = LANGS[0]; lw = sw; sinceEs = 0; }
          }
          if (!l) {
            if (!pool.length) refill();
            var pick = -1, look = Math.min(14, pool.length);
            for (var li = 0; li < look; li++) {
              var nm = pool[li][1];
              if (rowSet[nm] || prevSet[nm]) continue;
              var w = widthOf(pool[li]);
              if (used + (items.length ? minGap : 0) + w <= avail) { pick = li; break; }
            }
            if (pick < 0) break;
            l = pool.splice(pick, 1)[0];
            lw = widthOf(l);
            rowSet[l[1]] = 1;
            sinceEs++;
          }
          used += (items.length ? minGap : 0) + lw;
          items.push({ l: l, w: lw });
        }
        if (!items.length) continue;
        var total = 0;
        for (var ii = 0; ii < items.length; ii++) total += items[ii].w;
        var g = items.length > 1 ? Math.min((avail - total) / (items.length - 1), fs * 1.1) : 0;
        var lineW = total + g * (items.length - 1);
        var x0 = (segs[si][0] + segs[si][1]) / 2 - lineW / 2;
        for (var k = 0; k < items.length; k++) {
          var it = items[k];
          var f = (y - top) / (bottom - top);
          placed.push({
            txt: it.l[0] + ",", lang: it.l[1], left: x0, y: y, ph: rnd(0, TAU),
            col: "hsl(" + (346 + f * 30) + ",95%," + (62 + f * 20) + "%)", delay: 0
          });
          x0 += it.w + g;
        }
      }
    }
    if (placed.length) {
      var lastW = placed[placed.length - 1];
      lastW.txt = lastW.txt.replace(/,$/, "");
    }
    // Escritura continua: cada letra aparece justo después de la anterior, en el orden de lectura.
    var totalChars = 0, acc = 0, j;
    for (j = 0; j < placed.length; j++) totalChars += placed[j].txt.length + 1;
    cg = Math.max(8, Math.min(40, 7000 / Math.max(1, totalChars)));
    for (j = 0; j < placed.length; j++) {
      placed[j].delay = reduce ? 0 : acc * cg;
      acc += placed[j].txt.length + 1;
    }
    words = placed;
    endT = reduce ? 0 : acc * cg + 400;

    stars = [];
    for (var n = 0; n < 70; n++) stars.push({ x: Math.random() * W, y: Math.random() * H, r: rnd(0.4, 1.4), ph: rnd(0, TAU) });
  }

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    build();
  }

  function pickColors() {
    var a = BURST_COLORS[Math.floor(Math.random() * BURST_COLORS.length)];
    var b = BURST_COLORS[Math.floor(Math.random() * BURST_COLORS.length)];
    return [a, b === a ? "#ffd9a8" : b];
  }

  function spawn(x, y) {
    var R = Math.max(52, Math.min(112, Math.min(W, H) * 0.17)) * rnd(0.92, 1.15);
    var cols = pickColors();
    var b = { t: 0, R: R, x: x, y: y, parts: [], spark: [] };
    var layers = [[34, 1, 7.5], [20, 0.55, 5.5]];
    for (var li = 0; li < layers.length; li++) {
      var L = layers[li];
      for (var i = 0; i < L[0]; i++) {
        var p = raw(i / L[0] * TAU);
        var k = L[1] * R * 2.3 / 16;
        b.parts.push({
          x: x, y: y, vx: p[0] * k, vy: p[1] * k,
          size: L[2] * rnd(0.85, 1.2), rot: rnd(-0.5, 0.5), vr: rnd(-1, 1),
          life: rnd(1.4, 2.0), col: cols[li], ph: rnd(0, TAU)
        });
      }
    }
    for (var s = 0; s < 18; s++) {
      var a = rnd(0, TAU), sp = rnd(60, 220);
      b.spark.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rnd(0.8, 1.4) });
    }
    bursts.push(b);
    if (bursts.length > 14) bursts.shift();
    try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {}
  }

  function drawHeart(x, y, size, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    var k = size / 32;
    ctx.scale(k, k);
    ctx.fill(HEART);
    ctx.restore();
  }

  function drawBursts(dt) {
    var i, j, b;
    for (i = bursts.length - 1; i >= 0; i--) {
      b = bursts[i];
      b.t += dt;
      if (b.t > 2.4) { bursts.splice(i, 1); continue; }
    }
    ctx.globalCompositeOperation = "lighter";
    for (i = 0; i < bursts.length; i++) {
      b = bursts[i];
      var d = Math.pow(0.1, dt);
      for (j = 0; j < b.parts.length; j++) {
        var p = b.parts[j];
        p.vx *= d;
        p.vy = p.vy * d + 70 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.rot += p.vr * dt;
        var age = b.t / p.life;
        if (age >= 1) continue;
        var a = Math.min(1, b.t / 0.06) * Math.pow(1 - age, 1.3) * (0.82 + 0.18 * Math.sin(b.t * 14 + p.ph));
        ctx.globalAlpha = a;
        ctx.fillStyle = p.col;
        drawHeart(p.x, p.y, p.size * (1 - 0.4 * age), p.rot);
      }
      ctx.fillStyle = "#ffd9a8";
      for (j = 0; j < b.spark.length; j++) {
        var sp = b.spark[j];
        sp.vx *= d;
        sp.vy = sp.vy * d + 80 * dt;
        sp.x += sp.vx * dt;
        sp.y += sp.vy * dt;
        var sa = b.t / sp.life;
        if (sa >= 1) continue;
        ctx.globalAlpha = (1 - sa) * 0.9;
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, 1.6, 0, TAU);
        ctx.fill();
      }
    }
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
  }

  function frame(now) {
    var dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    var t = now - startT;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    // polvo de estrellas
    ctx.fillStyle = "#ffe9ee";
    for (var si = 0; si < stars.length; si++) {
      var st = stars[si];
      ctx.globalAlpha = 0.12 + 0.18 * (0.5 + 0.5 * Math.sin(now / 1100 + st.ph));
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // latido, solo cuando el corazón ya está completo
    var beat = 0;
    if (!reduce && t > endT + 300) {
      var ph = ((t - endT) % 1400) / 1400;
      var ramp = Math.min(1, (t - endT - 300) / 800);
      beat = ramp * 0.035 * (Math.exp(-Math.pow((ph - 0.08) / 0.06, 2)) + 0.7 * Math.exp(-Math.pow((ph - 0.26) / 0.07, 2)));
    }

    // resplandor tras el corazón
    var done = Math.max(0, Math.min(1, t / Math.max(1, endT)));
    var glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, heartW * 0.72);
    glow.addColorStop(0, "rgba(255,77,133," + (0.05 + 0.13 * done + beat * 2.5) + ")");
    glow.addColorStop(1, "rgba(255,77,133,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    // palabras
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1 + beat, 1 + beat);
    ctx.translate(-cx, -cy);
    ctx.font = "600 " + fs + "px " + FONT_FAMILY;
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    var latest = -1;
    for (var wi = 0; wi < words.length; wi++) {
      var w = words[wi];
      var n = Math.floor((t - w.delay) / cg) + 1;
      if (n <= 0) continue;
      latest = wi;
      var full = n >= w.txt.length;
      var amp = 0;
      if (full && !reduce) amp = 0.16 * Math.min(1, (t - w.delay - w.txt.length * cg) / 800);
      ctx.globalAlpha = 1 - amp * (0.5 + 0.5 * Math.sin(now / 900 + w.ph));
      ctx.fillStyle = w.col;
      ctx.fillText(full ? w.txt : w.txt.slice(0, n), w.left, w.y);
    }
    if (latest >= 0 && t < endT && !reduce) {
      var lw = words[latest];
      var ln = Math.max(1, Math.min(lw.txt.length, Math.floor((t - lw.delay) / cg) + 1));
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = "#ffd9a8";
      ctx.fillRect(lw.left + ctx.measureText(lw.txt.slice(0, ln)).width + 1, lw.y - fs * 0.5, 1.2, fs);
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    // idioma que va apareciendo y, al final, el mensaje
    var capY = cy + u * 14.5 + fs + 26;
    if (latest >= 0 && t < endT) {
      ctx.font = UI_FONT;
      if ("letterSpacing" in ctx) ctx.letterSpacing = "2.4px";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#ffd9a8";
      ctx.globalAlpha = 0.85;
      ctx.fillText(words[latest].lang.toUpperCase(), cx, capY);
      if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
      ctx.globalAlpha = 1;
    } else if (t >= endT && words.length) {
      ctx.font = "600 " + Math.round(Math.max(19, fs * 1.5)) + "px " + FONT_FAMILY;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#ffd9a8";
      ctx.globalAlpha = Math.min(1, (t - endT) / 800);
      ctx.fillText("Sin importar el idioma, yo te amo", cx, capY + 4, W - 32);
      ctx.globalAlpha = 1;
    }

    drawBursts(dt);
    requestAnimationFrame(frame);
  }

  function restart() {
    bursts = [];
    startT = performance.now();
    if (reduce) startT -= 1e5;
  }

  cv.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    spawn(e.clientX, e.clientY);
    if (!tapped) {
      tapped = true;
      hint.className = "off";
    }
  });
  btn.addEventListener("click", restart);

  var rt = 0;
  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(resize, 120);
  });

  resize();
  startT = performance.now();
  if (reduce) startT -= 1e5;
  lastT = startT;
  requestAnimationFrame(frame);
  setTimeout(function () { if (!tapped) hint.className = "on"; }, 1400);
})();
</script>
</body>
</html>
